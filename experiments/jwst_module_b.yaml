limitations:
  - Effective searched areas are summed detector intersections.
  - Empirical residual scores do not calibrate the global false-alarm probability.
  - Public registry checks establish the archived public record at a specified date.
  - Light-curve aperture uncertainties exclude correlated calibration systematics.
  - The slitless line apertures use instrumental count rates and local controls. Source overlap limits the interpretation.
  - The held-out filters share the October 2026 visit and the reported aperture fluxes omit total-flux correction.
  - The two public APT snapshots carry identical embedded target catalogues.
  - The measured light-centroid offset uses Gaussian core matching and shares one bright epoch.
  - MAST planned polygons represent field outlines and do not resolve individual detector gaps.
  - The STScI and DAWN mosaics have different processing but share telescope exposures.
  - The November difference measurements share image data and do not constrain the event onset or peak.
  - The JPL search covers known small bodies with predicted V magnitude of 28.5 or brighter at two midpoints.
  - Native visit medians require two usable exposures, and dither-pair comparisons share exposures.
  - The CANDELS F160W measurements use finite apertures and shared leave-one-out image references. They do not constrain unsampled dates.
  - Hubble recovery trials apply empirical PSF models after drizzling and reuse spatial controls across fluxes and models. The trials do not convert between HST and JWST filters.
  - The IRAC apertures include neighbouring light and the Chandra count limits use merged exposures with no PSF correction.
  - The ACS measurements use preliminary GOODS v0.5 images and finite apertures without PSF matching.
  - Spitzer same-channel differences use common 2004 references and remain affected by source blending.
  - The separate Chandra groups summarize sampled pointings and do not constrain all short flares.
  - The DECam archive metadata define geometric coverage and nominal release dates. The 2026 images remain proprietary.
  - The Fink result covers public alert objects and cannot qualify sensitivity at the transient position.
  - The MeerKAT coadd measures persistent radio emission on a 5.5-arcsec beam. Single-epoch variability remains unresolved.
  - Euclid H-band measurements combine calibrated public visit stacks and use spatial control scatter. They omit PSF matching and an aperture correction.
  - The Euclid Q1 detector exposures overlap the DR1 H visit stack. Two exposures are near detector edges, and the Y and J images bracket H within the visit.
  - DES z-band pixel measurements use one night per available calendar month and up to three exposures per night. Seeing is approximately matched with Gaussian kernels. Injection trials use residual coadds and do not account for signals confined to individual exposures.
  - ZTF image footprint and alert records constrain the public archive state and provide no local photometry.
  - The assessed Swift snapshot predates the Euclid visit by more than two days. Its XRT count-rate bounds omit PSF and energy-response corrections, and UVOT contributes image coverage.
  - Historical Swift counts use a fixed aperture that includes a nearby catalogued Chandra AGN. LSXPS stacked datasets overlap in time and can reuse observations included in the aperture scan.
  - TESS gives limits on excursions from a sector reference, conditional on sampled hours and days and a matched optical point-source profile. The archive cutouts end before both JWST visits. The TESS-point footprint predictions are separate from measured pixels.
  - Las Cumbres r-prime fixed-aperture fluxes use a stellar calibration against PS1 r, evaluated at a fixed color. Some archive geometry hits are shallow focus frames. The ESO KMOS audit tests nominal IFU geometry rather than calibrated spectra.
  - ALMA limits apply to compact continuum sources in sampled historical datasets. The beam-fit errors use nearby residuals. Large published primary-beam files were omitted from the bounded download and these cutouts are qualified by local scatter in the delivered corrected pixels.
  - The NVSS and W-CDFS mosaics combine observations and their beams blend nearby galaxies. VLASS epoch 1.1 Quick Look photometry has documented pointing and flux-scale limitations. The 2026 NRAO search constrains scan centers within 24 arcmin, not every possible primary beam.
  - The ROSAT and eROSITA apertures encompass the nearest catalogued Chandra source. The limits apply to short sampled exposures, and DR2 adds two scans to DR1 without releasing their event files or per-scan limits.
  - Chandra event counts use fixed windows and a local background. Count bounds omit effective area and point-spread corrections.
  - Spitzer matching uses a local linear image model and fixed artificial point sources to test sensitivity.
  - RapidXMM limits use wide apertures at nearby sky cells and can include unrelated emission.
  - VISTA pawprint polygons do not qualify local coverage in every image. The H-band pilot samples three blocks and omits per-pixel confidence weighting.
