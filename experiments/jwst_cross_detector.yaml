limitations:
  - Empirical residual rankings lack a global false-alarm calibration.
  - Cross-detector coincidences can arise from shared astrometric or morphological effects.
  - Catalogue and archival follow-up checks are needed for novelty decisions.
  - Host identification, redshift and event type are unresolved.
  - The forced slitless extraction blends with a bright galaxy in all full-coverage exposures.
  - Signed aperture excesses share an October 2026 baseline and omit systematic uncertainties.
  - The public Chandra coverage found by the footprint query ends before the bright epoch.
