limitations:
  - Full pinned DR4 catalogue audited; not all public archives.
  - Positive single-Gaussian catalogue fits cannot identify broad-line physics.
  - Reference contrasts are diagnostic scores, not calibrated p-values.
  - Apertures and nod combinations share photons; agreement is not independent confirmation.
  - Core integrals are signed but are not deblended total emission-line fluxes.
  - Extended-wavelength calibration and unreported covariance remain uncertain.
  - GS-30099449 held for catalogue PID 1180 versus FITS PID 1286.
  - 2D sheets require usable 1D coverage and positive finite 2D errors.
  - Image subset selected after the core check and is explicitly exploratory.
  - Three core priorities have not passed complete physical-model or novelty tests.
