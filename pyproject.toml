[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmic-anomaly-lab"
version = "0.1.0"
description = "Provenance-first multi-survey JWST research and reproducible spectroscopy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Biswajit Jana"}]
dependencies = ["numpy>=2", "scipy>=1.14", "pandas>=2.2", "astropy>=7", "astroquery>=0.4.10", "specutils>=2", "matplotlib>=3.9", "scikit-learn>=1.6", "requests>=2.32", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "build>=1"]
posters = ["reportlab>=4", "pypdf>=5"]

[project.scripts]
cosmic-lab = "cosmic_anomaly_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"src/cosmic_anomaly_lab/pipeline.py" = ["E402"]

